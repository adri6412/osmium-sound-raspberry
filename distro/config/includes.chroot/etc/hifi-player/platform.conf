# Per-image platform configuration for the Raspberry Pi build.
# Read at import by core/hifi_platform.py into the process environment
# (os.environ.setdefault), so an explicit env var still wins. KEY=VALUE only.
HIFI_PLATFORM=rpi
HIFI_IMAGE_PREFIX=osmium-rpi-
HIFI_OTA_REPO=adri6412/osmium-sound-raspberry
# OTA served from Oracle Object Storage (Milan), READ pre-authenticated request.
HIFI_OTA_MANIFEST_BASE=https://objectstorage.eu-milan-1.oraclecloud.com/p/_ARLDmSI67zHinw2p25J7xB0rcQQkbpOPlxJ0qnT5NRI1-mf7q7kWXzoapJ2GSwS/n/axdognj0blsq/b/bucket-osmiumsound-raspberry/o/ota-rpi
HIFI_OTA_PROD_MIRROR_BASE=https://objectstorage.eu-milan-1.oraclecloud.com/p/_ARLDmSI67zHinw2p25J7xB0rcQQkbpOPlxJ0qnT5NRI1-mf7q7kWXzoapJ2GSwS/n/axdognj0blsq/b/bucket-osmiumsound-raspberry/o/ota-rpi
