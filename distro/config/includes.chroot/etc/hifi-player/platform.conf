# Per-image platform configuration for the Raspberry Pi build.
# Read at import by core/hifi_platform.py into the process environment
# (os.environ.setdefault), so an explicit env var still wins. KEY=VALUE only.
HIFI_PLATFORM=rpi
HIFI_IMAGE_PREFIX=osmium-rpi-
HIFI_OTA_REPO=adri6412/osmium-sound-raspberry
# Primary: the manifest is served from Cloudflare Pages, the same host that
# serves the x86 fleet's manifest (osmium-sound.pages.dev). Reading it there is
# what lets the site count active Raspberry appliances, a byproduct of the
# update check the box makes anyway — no telemetry, nothing personal stored
# (osmium-sound-site/functions/_middleware.js). The .raucb itself is named by
# absolute URLs inside the manifest and still downloads from Oracle.
HIFI_OTA_MANIFEST_BASE=https://osmium-sound.pages.dev/ota-rpi
# Mirror fallback: Oracle Object Storage (Milan), READ pre-authenticated
# request. Used when the primary cannot be reached (_fetch_release_chain).
HIFI_OTA_PROD_MIRROR_BASE=https://objectstorage.eu-milan-1.oraclecloud.com/p/_ARLDmSI67zHinw2p25J7xB0rcQQkbpOPlxJ0qnT5NRI1-mf7q7kWXzoapJ2GSwS/n/axdognj0blsq/b/bucket-osmiumsound-raspberry/o/ota-rpi
