# Osmium Sound (Raspberry Pi fork) — run the Qt kiosk from its RAM-staged copy.
#
# hifi-qt-ram.service populates /run/hifi-qt (tmpfs copy of /opt/hifi-qt, or a
# bind mount of it as a fallback) before this unit starts. Running the binary
# and reading the assets from there avoids the squashfs decompress-on-access
# stutter on screen changes. The base ExecStart is cleared (empty assignment)
# then redefined to point at /run/hifi-qt; the base ExecStartPre lines
# (plymouth quit, chvt) are kept.
[Unit]
Requires=hifi-qt-ram.service
After=hifi-qt-ram.service

[Service]
WorkingDirectory=/run/hifi-qt
ExecStart=
ExecStart=/run/hifi-qt/hifi-qt --assets /run/hifi-qt/assets --locales /run/hifi-qt/locales
