# Osmium Sound (Raspberry Pi fork) — trust anchor for the VU-meter and
# animation stores.
#
# The stores (api_server.py) download their catalogue from
# file.osmiumsound.it/{vu,anim}/ and verify its Ed25519 signature. By default
# that check uses /etc/hifi-player/ota-pubkey.pem — correct on the x86 image,
# where that key also signs the catalogue. This fork ships its OWN OTA key
# (it signs the Pi RAUC bundles), which does NOT match the catalogue signature,
# so the stores would reject every catalogue and list nothing.
#
# Point the store verification at a separate, PUBLIC key that is the upstream
# (x86) catalogue-signing key — shipped at /etc/hifi-player/store-pubkey.pem.
# The fork OTA key stays independent. Trusting this public key only lets the Pi
# accept the same catalogue and .vupak/.anpak packages the x86 image accepts.
[Service]
Environment=HIFI_VU_STORE_PUBKEY=/etc/hifi-player/store-pubkey.pem
Environment=HIFI_ANIM_STORE_PUBKEY=/etc/hifi-player/store-pubkey.pem
