name: Build Osmium Raspberry Pi image (manual)

# Builds the Osmium Sound image for the Raspberry Pi 4 AND Pi 5 (one image, both
# boards; full feature parity with x86 — bundled Lyrion, DSP, CD ripping, web
# admin, Bluetooth) on a native arm64 runner. Mirror of the x86 build-iso.yml,
# but there is no live ISO and no GRUB: the Pi boots through its firmware tryboot
# A/B scheme (autoboot.txt + boot_partition), and the image is a RAUC A/B disk.
#
#   Actions -> "Build Osmium Raspberry Pi image (manual)" -> Run workflow
#     • version : e.g. 2.5.26-dev.6-alpha3 (goes into IMAGE_VERSION / RAUC manifest)
#     • suite   : Debian suite (default: trixie — Qt6 needs Debian 13)
#     • sign    : sign the RAUC bundle with the repo secrets (default: true).
#     • publish : cut a GitHub Release + mirror to Oracle Object Storage (needs sign).
#
# Signing keys come from repository secrets, NEVER from the tree:
#   RAUC_SIGNING_CERT / RAUC_SIGNING_KEY  the X.509 cert+key for the .raucb
#   OTA_SIGNING_KEY                       the Ed25519 key for the .img sidecar
# The public keyring (distro/rauc-keys/keyring.pem) and OTA pubkey
# (distro/ota-keys/ota-pubkey.pem) are checked in and used to verify.
#
# OTA delivery (api_server.py): the primary manifest lives on Oracle Object
# Storage (Milan, ota-rpi/latest-<channel>.json, read via a public READ PAR),
# with the GitHub Releases API (rate-limited 60/h/IP) as the always-available
# fallback. The old Cloudflare Pages / gh-pages manifest and the Cloudflare R2
# mirror are both gone. Publishing the Release alone already makes OTA work (via
# the API fallback); the Oracle mirror just adds a non-rate-limited CDN path.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g. 2.5.26-dev.6-alpha3)'
        required: true
        type: string
      suite:
        description: 'Debian suite'
        required: false
        type: string
        default: 'trixie'
      sign:
        description: 'Sign the RAUC bundle with the repo secrets (untick for an unsigned test build)'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Publish a Release + Oracle Object Storage mirror for OTA (needs sign=true). Off = artifacts only, no tag.'
        required: false
        type: boolean
        default: false

# contents: write is needed by the optional publish step (gh release); harmless
# when publish=false (that step is skipped).
permissions:
  contents: write

jobs:
  # 🚨 On the bare arm64 runner, not in a container: build-payload.sh builds the
  # Qt interface natively inside a `debian:trixie` docker container, which on an
  # arm64 runner is arm64 — a real aarch64 build, no qemu. It cannot run inside
  # the image container (no docker there), same reason as the x86 ISO.
  qt-payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the Qt on-screen interface payload (arm64)
        run: bash native-ui-qt/ci/build-payload.sh qtui

      - name: Verify the payload really is aarch64
        run: |
          set -eu
          file qtui/hifi-qt || true
          mach=$(od -An -tu1 -j18 -N1 qtui/hifi-qt | tr -d ' ')
          [ "$mach" = 183 ] || { echo "::error::qtui/hifi-qt is not an aarch64 ELF (e_machine=$mach, want 183)"; exit 1; }

      - name: Upload the Qt payload
        uses: actions/upload-artifact@v4
        with:
          name: qt-payload
          path: qtui
          retention-days: 1
          if-no-files-found: error

  # 🚨 On the bare x86 runner, not in a container: build-np.sh builds the
  # "Now Playing" web page (/np) as Qt→WebAssembly, from the vendored sources in
  # native-ui-np/, and ships it as the np-payload artifact for /opt/hifi-np.
  # Mirrors x86 build-ui-ota.yml: the output is portable WASM, so this runs on
  # x86 (the emsdk 3.1.56 + Qt 6.8.2 WASM toolchain is x86), NOT arm64 — the
  # image job below just drops the bytes into the rootfs.
  np-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build tools (cmake is preinstalled on the runner)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build fonts-dejavu-core
      - name: Cache the WASM toolchain (emsdk + Qt)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../toolchain
          key: toolchain-emsdk-3.1.56-qt-6.8.2-${{ hashFiles('native-ui-np/scripts/setup-toolchain.sh', 'native-ui-np/scripts/fix-qt-static.py') }}
      - name: Set up the WASM toolchain (cached after the first run)
        run: TOOLCHAIN="$GITHUB_WORKSPACE/../toolchain" bash native-ui-np/scripts/setup-toolchain.sh
      - name: Build the Now Playing web payload (/opt/hifi-np)
        run: |
          cd native-ui-np
          OSMIUM="$GITHUB_WORKSPACE" TOOLCHAIN="$GITHUB_WORKSPACE/../toolchain" bash scripts/build-np.sh
          [ -f build/np/index.html ] || { echo "::error::Now Playing web build produced no index.html" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: np-payload
          path: native-ui-np/build/np
          retention-days: 1
          if-no-files-found: error

  # The system image (rootfs.squashfs + the RAUC bundle) and the flashable
  # SD/USB .img. Built in a privileged debian:trixie container on the arm64
  # runner, so debootstrap/mksquashfs/losetup/rauc all run native arm64.
  image:
    runs-on: ubuntu-24.04-arm
    needs: [qt-payload, np-payload]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    container:
      image: debian:trixie
      options: --privileged
      volumes:
        - /mnt:/mnt
    steps:
      - name: Install base tooling (container is minimal)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils sudo python3 build-essential \
            debootstrap debian-archive-keyring rsync fakeroot \
            squashfs-tools dosfstools mtools \
            rauc e2fsprogs zstd openssl initramfs-tools-core \
            file fdisk gdisk mount util-linux

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-webui/package-lock.json

      - name: Fetch the Qt interface built by the qt-payload job
        uses: actions/download-artifact@v8
        with:
          name: qt-payload
          path: qtui

      - name: Fetch the Now Playing web build (/opt/hifi-np) from the np-payload job
        uses: actions/download-artifact@v8
        with:
          name: np-payload
          path: npout

      - name: Build web-admin (Vue)
        run: |
          if [ -f admin-webui/package.json ]; then
            (cd admin-webui && npm ci && npm run build)
          else
            echo "::error::admin-webui/package.json missing — cannot build the web-admin UI" >&2
            exit 1
          fi

      - name: Inject the payloads into includes.chroot
        run: |
          set -eux
          chmod 755 qtui/hifi-qt
          [ -f qtui/hifi-media-player ] && chmod 755 qtui/hifi-media-player || true
          QT_DEST=distro/config/includes.chroot/opt/hifi-qt
          WEBUI_DEST=distro/config/includes.chroot/opt/hifi-webui/dist
          mkdir -p "$QT_DEST" "$WEBUI_DEST"
          cp -a qtui/. "$QT_DEST/"
          [ -f admin-webui/dist/index.html ] || { echo "::error::admin-webui/dist missing after build"; exit 1; }
          cp -a admin-webui/dist/. "$WEBUI_DEST/"
          # Now Playing web build (/opt/hifi-np), compiled by the np-payload job.
          # REQUIRED: without it a device answers /np "Now Playing web build not
          # installed". apply.d/0065-np-files.sh closes the first-update gap.
          NP_DEST=distro/config/includes.chroot/opt/hifi-np
          [ -f npout/index.html ] || { echo "::error::Now Playing web build (npout/index.html) missing — refusing to package a system bundle whose /np answers 'not installed'" >&2; exit 1; }
          mkdir -p "$NP_DEST"
          cp -a npout/. "$NP_DEST/"

      - name: Work out the OTA channel from the version
        id: channel
        env:
          V: ${{ inputs.version }}
        run: |
          set -eu
          case "$V" in
            *-*alpha*) CH=alpha ;;
            *-*)       CH=dev ;;
            *)         CH=prod ;;
          esac
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Build the Raspberry Pi system image (+ RAUC bundle)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_SIGN: ${{ inputs.sign }}
          RAUC_SIGNING_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
          RAUC_SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /mnt/rpi-out
          export IMAGE_OUT=/mnt/rpi-out IMAGE_WORK=/mnt
          chmod +x distro/build-rpi.sh distro/build-image-rpi.sh
          ARGS=(--version "$INPUT_VERSION" --suite "$INPUT_SUITE")
          if [ "$INPUT_SIGN" = "true" ]; then
            if [ -z "${RAUC_SIGNING_CERT:-}" ] || [ -z "${RAUC_SIGNING_KEY:-}" ]; then
              echo "::error::sign=true but RAUC_SIGNING_CERT / RAUC_SIGNING_KEY secrets are not set"
              exit 1
            fi
            # Confine the restrictive umask to just these two temp-file writes.
            # A global `umask 077` would persist through build-rpi.sh and make apt
            # create /usr/share/keyrings/raspberrypi-archive-keyring.gpg mode 0600,
            # which sqv (apt's sandboxed OpenPGP verifier) then cannot read →
            # "Permission denied" → "repository is not signed". RUNNER_TEMP is
            # runner-private and both files are rm'd below, so 0600 here is enough.
            ( umask 077
              printf '%s' "$RAUC_SIGNING_CERT" > "$RUNNER_TEMP/rauc-cert.pem"
              printf '%s' "$RAUC_SIGNING_KEY"  > "$RUNNER_TEMP/rauc-key.pem" )
            ARGS+=(--cert "$RUNNER_TEMP/rauc-cert.pem" --key "$RUNNER_TEMP/rauc-key.pem" --keep-rootfs)
          else
            ARGS+=(--no-bundle)
          fi
          ./distro/build-rpi.sh "${ARGS[@]}"
          rm -f "$RUNNER_TEMP/rauc-cert.pem" "$RUNNER_TEMP/rauc-key.pem"
          ls -lh /mnt/rpi-out

      - name: Assemble the flashable SD/USB image
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SQ="/mnt/rpi-out/osmium-rpi-${INPUT_VERSION}.rootfs.squashfs"
          [ -f "$SQ" ] || { echo "::error::rootfs.squashfs not found: $SQ"; exit 1; }
          IMAGE_WORK=/mnt ./distro/build-image-rpi.sh \
            --rootfs "$SQ" \
            --out "/mnt/rpi-out/osmium-rpi-${INPUT_VERSION}.img"
          xz -T0 -6 -v "/mnt/rpi-out/osmium-rpi-${INPUT_VERSION}.img"
          ls -lh /mnt/rpi-out

      - name: Checksum + sign the artifacts
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          cd /mnt/rpi-out
          IMG="osmium-rpi-${INPUT_VERSION}.img.xz"
          sha256sum "$IMG" > "$IMG.sha256"
          if [ "$INPUT_SIGN" = "true" ] && [ -f "osmium-rpi-${INPUT_VERSION}.raucb" ]; then
            sha256sum "osmium-rpi-${INPUT_VERSION}.raucb" > "osmium-rpi-${INPUT_VERSION}.raucb.sha256"
          fi
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            echo "::notice::OTA_SIGNING_KEY not set — disk image left unsigned (checksum only)"
          else
            umask 077
            printf '%s' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota-key.pem"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/ota-key.pem" -rawin \
              -in "$IMG.sha256" -out "$IMG.sha256.sig"
            rm -f "$RUNNER_TEMP/ota-key.pem"
            openssl pkeyutl -verify -pubin \
              -inkey "$GITHUB_WORKSPACE/distro/ota-keys/ota-pubkey.pem" \
              -rawin -in "$IMG.sha256" -sigfile "$IMG.sha256.sig" \
              || { echo "::error::the signature does not verify against the shipped public key"; exit 1; }
          fi
          ls -lh

      - name: Upload the RAUC bundle
        uses: actions/upload-artifact@v4
        with:
          name: osmium-rpi-raucb-${{ inputs.version }}
          path: |
            /mnt/rpi-out/osmium-rpi-*.raucb*
            /mnt/rpi-out/osmium-rpi-*.info.txt
            /mnt/rpi-out/osmium-rpi-*.build-info.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the flashable disk image
        uses: actions/upload-artifact@v4
        with:
          name: osmium-rpi-img-${{ inputs.version }}
          path: /mnt/rpi-out/osmium-rpi-*.img.xz*
          retention-days: 14
          if-no-files-found: error

      # ── OTA publish (opt-in, needs sign) ──────────────────────────────────
      # 🚨 The only steps that create a tag/Release or touch the CDN. They run
      # only when the operator ticks `publish` AND `sign`, so no tag is cut on a
      # plain build.
      - name: Publish GitHub Release (OTA)
        if: ${{ inputs.publish && inputs.sign }}
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ inputs.version }}
          # Tag the commit this image was actually built from, NOT the default
          # branch. Without this the tag lands on main (an older commit), GitHub
          # dates the release by that commit and orders it below newer alphas,
          # so the device's GitHub-API fallback never offers it.
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          body: "Osmium Sound image ${{ inputs.version }} for Raspberry Pi 4 & Pi 5 (RAUC A/B bundle for OTA, plus the flashable SD/USB image)."
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.channel == 'prod' }}
          fail_on_unmatched_files: true
          files: |
            /mnt/rpi-out/osmium-rpi-${{ inputs.version }}.raucb
            /mnt/rpi-out/osmium-rpi-${{ inputs.version }}.raucb.sha256
            /mnt/rpi-out/osmium-rpi-${{ inputs.version }}.img.xz
            /mnt/rpi-out/osmium-rpi-${{ inputs.version }}.img.xz.sha256
            /mnt/rpi-out/osmium-rpi-${{ inputs.version }}.info.txt

      # OTA delivery is Oracle Object Storage (Milan) as the single manifest
      # source, with the GitHub REST API as the safety-net fallback. The old
      # Cloudflare Pages / gh-pages manifest path was dropped (the Pages project
      # never existed); api_server.py now reads the manifest straight from the
      # Oracle READ PAR (OTA_MANIFEST_BASE == OTA_PROD_MIRROR_BASE).
      #
      # Mirror the bundle + channel manifest to Oracle Object Storage, the
      # replacement for the retired Cloudflare R2 mirror. Upload goes through a
      # WRITE Pre-Authenticated Request (secret OCI_PAR_WRITE_URL, scoped to the
      # ota-rpi/ prefix) with curl — no S3 keys, no awscli. The manifest is
      # rebuilt with asset URLs pointing at the READ PAR (public: the same token
      # baked into OTA_PROD_MIRROR_BASE in api_server.py) so the device fetches
      # the .raucb from the same mirror. Skips cleanly if the write secret is
      # absent (the GitHub Release + REST API fallback still serve OTA).
      #
      # PAR URL shape: https://objectstorage.<region>.oraclecloud.com/p/<token>/
      # n/<ns>/b/<bucket>/o/  — an object named ota-rpi/<x> is PUT/GET at
      # "<par>/ota-rpi/<x>" (both secrets stored WITH the trailing /o/; we strip
      # it so a single "/o" remains before the object name).
      - name: Mirror the bundle + manifest to Oracle Object Storage (PAR)
        if: ${{ inputs.publish && inputs.sign }}
        env:
          # WRITE PAR (ota-rpi/ prefix) — the only secret; never in source.
          PAR_WRITE: ${{ secrets.OCI_PAR_WRITE_URL }}
          # READ PAR (ota-rpi/ prefix) — public (same token baked into
          # OTA_PROD_MIRROR_BASE in api_server.py), so hardcoded here too.
          PAR_READ: https://objectstorage.eu-milan-1.oraclecloud.com/p/_ARLDmSI67zHinw2p25J7xB0rcQQkbpOPlxJ0qnT5NRI1-mf7q7kWXzoapJ2GSwS/n/axdognj0blsq/b/bucket-osmiumsound-raspberry/o/
          CH: ${{ steps.channel.outputs.channel }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PAR_WRITE:-}" ]; then
            echo "::warning::Oracle write PAR secret not set — skipping the object-store mirror (GitHub Release + API still serve OTA)"
            exit 0
          fi
          W="${PAR_WRITE%/}"   # .../o
          R="${PAR_READ%/}"    # .../o
          cd /mnt/rpi-out
          for f in "osmium-rpi-$TAG.raucb" "osmium-rpi-$TAG.raucb.sha256"; do
            curl --fail -sS -T "$f" "$W/ota-rpi/$TAG/$f"
          done
          # Rebuild the manifest with asset URLs on the public READ PAR.
          OTA_ASSET_BASE="$R/ota-rpi/$TAG" \
          EXTRA_ASSETS="osmium-rpi-$TAG.raucb osmium-rpi-$TAG.raucb.sha256" \
            python3 "$GITHUB_WORKSPACE/.github/scripts/make-ota-manifest.py" \
              "$TAG" "${{ github.repository }}" "$CH" "" "" ""
          curl --fail -sS -H 'Content-Type: application/json' \
            -T "manifest-out/latest-$CH.json" "$W/ota-rpi/latest-$CH.json"
          echo "mirrored osmium-rpi-$TAG.raucb and latest-$CH.json to Oracle Object Storage (ota-rpi/)"
